name: Sponsor PR

# Turns an approved "Add a sponsor" issue into a pull request against
# src/sponsors.json. Triggered only when L1nSn0w applies the `sponsor` label,
# so opening an issue alone does nothing — every entry is reviewed twice
# (the label, then the PR merge).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-sponsor:
    if: github.event.label.name == 'sponsor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Parse issue form
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/add-sponsor.yml

      - name: Update sponsors.json
        id: update
        env:
          ISSUE_PAYLOAD: ${{ steps.parse.outputs.jsonString }}
        run: bun run scripts/add-sponsor.mjs

      - name: Format with Prettier
        run: bunx prettier --write src/sponsors.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: sponsor/issue-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "${{ steps.update.outputs.title }} (#${{ github.event.issue.number }})"
          title: "${{ steps.update.outputs.title }} (#${{ github.event.issue.number }})"
          body: |
            Adds a sponsor from #${{ github.event.issue.number }}.

            Please eyeball the new entry in `src/sponsors.json` before merging.

            Closes #${{ github.event.issue.number }}

      # If parsing/validation failed, tell the issue author why instead of
      # failing silently in the Actions tab.
      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ Couldn't turn this into a pull request automatically — check the form fields. [Run log](${run}).`,
            });
